name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Setup Godot 4.6.3
        run: bash scripts/setup-godot-ci.sh
      - name: Build production
        run: npm run build
      - name: Build default /test mirror
        run: npm run build --workspace @4444555/portal -- --base=/test/ --outDir=dist-test
      - name: Assemble and validate Pages artifact
        run: |
          mkdir -p apps/portal/dist/test
          cp -a apps/portal/dist-test/. apps/portal/dist/test/
          rm -f apps/portal/dist/test/CNAME
          test -f apps/portal/dist/index.html
          test -f apps/portal/dist/CNAME
          test -f apps/portal/dist/.nojekyll
          test -f apps/portal/dist/test/index.html
          test -f apps/portal/dist/games/pulse-loom/index.html
          test -f apps/portal/dist/games/pulse-loom/index.js
          test -f apps/portal/dist/games/pulse-loom/index.wasm
          test -f apps/portal/dist/games/pulse-loom/index.pck
          test -f apps/portal/dist/test/games/pulse-loom/index.html
          test -f apps/portal/dist/test/games/pulse-loom/index.js
          test -f apps/portal/dist/test/games/pulse-loom/index.wasm
          test -f apps/portal/dist/test/games/pulse-loom/index.pck
          grep -q 'src="/assets/index-' apps/portal/dist/index.html
          grep -q 'src="/test/assets/index-' apps/portal/dist/test/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/portal/dist
      - id: deployment
        uses: actions/deploy-pages@v4
