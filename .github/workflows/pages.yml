name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Assert artifact is complete
        run: |
          test -f apps/portal/dist/index.html
          test -f apps/portal/dist/CNAME
          test -f apps/portal/dist/.nojekyll
          grep -q 'crossorigin src="/assets/index-' apps/portal/dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/portal/dist
      - id: deployment
        uses: actions/deploy-pages@v4
