# LongHorizon-Harness configuration for 4444555 Arcade (4444555.xyz)

[run]
agent = "antigravity"
model = "gemini-3.1-pro-high"

env = "local"
runs_root = "./.lh-harness/runs"
prompt_language = "en"

max_rounds = 25
dashboard = true
dashboard_port = 0

[run.timeouts]
manager = 300
gui_executor = 1800
cli_executor = 1800
auditor = 300

[run.roles.manager]
agent = "antigravity"
model = "gemini-3.1-pro-high"

[run.roles.executor]
agent = "antigravity"
model = "gemini-3.6-flash"

[run.roles.cli_executor]
agent = "antigravity"
model = "gemini-3.6-flash"

[run.roles.auditor]
agent = "antigravity"
model = "gemini-3.1-pro-high"

[run.roles.cli_auditor]
agent = "antigravity"
model = "gemini-3.1-pro-high"

[run.roles.final_response]
agent = "antigravity"
model = "gemini-3.1-pro-high"
